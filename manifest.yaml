guid: 1f4abf26-0873-416e-8b8a-4bb61ed3b45b
name: customRequirementsNumbering
caption: Custom Requirements Numbering
summary: Assigns project-unique, prefix-based requirement numbers per requirement type and can substitute them into the requirement Name.
description: >
  Custom Requirements Numbering assigns a project-unique number to each
  Requirement, based on a prefix looked up per Requirement type from up to
  20 admin-configured Type/Prefix pairs (each an ordinary native setting -
  no custom fields on the requirement itself). When a user saves a
  requirement, the SpiraApp writes the next available number for that
  type's prefix into a chosen custom property, zero-padded to 4 digits,
  and never reuses a number. Optionally the same value is copied into the
  requirement Name. See Readme.md for full configuration and behaviour
  details.
productSummary: Assigns project-unique, prefix-based requirement numbers and can substitute them into the requirement Name.
productDescription: >
  Configure a prefix for up to 20 Requirement types (see Readme.md),
  choose which custom property stores the generated number, and
  optionally have the requirement Name kept in sync with it automatically.
author: Inmarsys Limited
url: https://github.com/Inmarsys/CustomRequirementsNumbering
license: Inmarsys Non-Resale License 1.0
copyright: Copyright Inmarsys Limited
version: 0.1

pageContents:
  - pageId: 9
    name: customRequirementsNumberingDetails
    code: file://requirementDetails.js

productSettings:
  - settingTypeId: 3
    artifactTypeId: 1
    name: rnfPropertyName
    caption: Requirement Number Custom Property
    position: 1
    tooltip: >
      Select the custom TEXT property that will store the generated
      requirement number (e.g. SWFR0007). Must be a plain-text custom
      property on Requirements. Set it read-only in the workflow to
      prevent accidental editing.
  - settingTypeId: 10
    name: nameSubstitution
    caption: Substitute Name for Requirement Number
    position: 2
    tooltip: >
      When ticked, the requirement Name is overwritten with its generated
      number on every save.
